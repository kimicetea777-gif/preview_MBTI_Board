spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/mbti_board
    username: mbti_user
    password: mbti_password
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: localhost
      port: 6379
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret
            scope: email, profile
          kakao:
            client-id: test-kakao-client-id
            client-secret: test-kakao-client-secret
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: profile_nickname, profile_image, account_email
            client-authentication-method: client_secret_post
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  mail:
    host: localhost
    port: 25
    username: test@test.com

jwt:
  secret: test-secret-key-must-be-at-least-32-characters-long
  access-expiry: 1800000
  refresh-expiry: 604800000

frontend:
  url: http://localhost:3000

r2:
  access-key: test-access-key
  secret-key: test-secret-key
  account-id: test-account-id
  bucket: test-bucket
  public-url: http://test-r2.local

internal:
  api-key: test-internal-api-key

app:
  cookie:
    secure: false
