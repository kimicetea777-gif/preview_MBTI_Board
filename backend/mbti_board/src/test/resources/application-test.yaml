spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/mbti_board
    username: mbti_user
    password: mbti_password
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: localhost
      port: 6379
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret
            scope: email, profile

  mail:
    host: localhost
    port: 25
    username: test@test.com

jwt:
  secret: test-secret-key-must-be-at-least-32-characters-long
  access-expiry: 1800000
  refresh-expiry: 604800000
  signup-expiry: 600000

frontend:
  url: http://localhost:3000

image-server:
  url: http://test-image-server.local
  api-key: test-image-server-api-key
  public-url: http://test-r2.local

app:
  cookie:
    secure: false
