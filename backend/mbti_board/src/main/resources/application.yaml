spring:
  application:
    name: mbti-board

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000
      keepalive-time: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 100
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  flyway:
    # clean-disabled: false
    enabled: true
    # clean-disabled: false
    # db/migration-dev(로컬 전용 더미 유저/글/댓글)는 기본값에 포함 — prod 프로필에서는 application-prod.yaml이 제외
    # db/migration-seed(실제 사이트에도 노출해도 되는 시드 — 가짜 유저 활동이 아닌 집계 데이터 등)는
    # dev/prod 둘 다에 포함
    # 주의: db/migration-dev, db/migration-seed는 db/migration의 하위 폴더가 아닌 형제 폴더여야 함 —
    #       Flyway는 location을 재귀적으로 스캔하므로, 하위 폴더로 두면 prod에서 classpath:db/migration만
    #       지정해도 그 안에 포함된 것으로 같이 스캔되어 제외가 안 됨 (실제로 겪은 버그)
    locations: classpath:db/migration,classpath:db/migration-dev,classpath:db/migration-seed

  mail:
    host: ${MAIL_HOST}
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

  security:
    oauth2:
      client:
        registration:
          # AS(Authorization Server, client_id=TypeButter) — 로그인/가입/비밀번호 재설정을 전부 위임.
          thebluebutter:
            client-id: TypeButter
            client-secret: ${AUTH_SERVER_CLIENT_SECRET}
            #access token 만료 후 사용자를 다시 로그인 화면으로 안 보내고 backend가 조용히 /oauth2/token에 grant_type=refresh_token으로만 요청해서 새 토큰을 받을 수 있게 허용
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/thebluebutter"
            scope: openid, profile
          # AS 계정 하드 삭제 폴링(GET /api/internal/deleted-users) + 멤버십 상태 변경 폴링
          # (GET /api/internal/membership-events) 공용 서버-to-서버 client.
          # 로그인용 thebluebutter와 완전히 분리된 별도 secret — 이 쪽이 유출돼도 로그인 흐름엔 영향 없음.
          typebutter-deletion-sync:
            client-id: TypeButter-deletion-sync
            client-secret: ${AUTH_SERVER_DELETION_SYNC_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            provider: thebluebutter
            scope: deletion:read, membership-events:read
        provider:
          # thebluebutter는 Spring Boot의 사전 정의 provider 프리셋이 아니므로 issuer-uri를 직접 지정해야 함
          thebluebutter:
            issuer-uri: ${AUTH_SERVER_ISSUER_URI}

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  access-expiry: 1800000 # 30분 (ms)
  refresh-expiry: 604800000 # 7일 (ms)

# AS의 refresh token 수명은 프레임워크 기본값이라 명시적 상수가 없음(connect_manual.md 실측: 30일,
# 매 refresh마다 rotation) — 세션/AC Redis 엔트리 TTL 계산에 씀
authserver:
  refresh-token-ttl-days: 30
  # 계정 하드 삭제 폴링(GET /api/internal/deleted-users) 호출 시 RestClient baseUrl로 씀 — oauth2
  # provider.thebluebutter.issuer-uri와 값은 같지만(같은 AS) Spring OAuth2 설정 트리 밖에서 별도로 필요
  issuer-uri: ${AUTH_SERVER_ISSUER_URI}

frontend:
  url: ${FRONTEND_URL:http}

app:
  name: ${APP_NAME}
  cookie:
    secure: ${APP_COOKIE_SECURE:true} # 로컬 개발 시 환경변수 APP_COOKIE_SECURE=false 설정
    # 프론트(typebutter.thebluebutter.com)와 백엔드(api-typebutter.thebluebutter.com)가 다른
    # 서브도메인이라, 비워두면(로컬 localhost) host-only 쿠키가 되어 두 도메인 간 공유가 안 됨.
    # prod에서만 APP_COOKIE_DOMAIN=.thebluebutter.com으로 두 서브도메인이 공유하게 함.
    domain: ${APP_COOKIE_DOMAIN:}

image-server:
  url: ${IMAGE_SERVER_URL}
  api-key: ${IMAGE_SERVER_API_KEY}
  public-url: ${IMAGE_SERVER_PUBLIC_URL}

rate-limit:
  ip-salt: ${RATE_LIMIT_IP_SALT}

retention:
  encryption: #수사 협조 데이터 암호화
    password: ${RETENTION_ENCRYPTION_PASSWORD}
    salt: ${RETENTION_ENCRYPTION_SALT}

alert:
  mail:
    to: ${ALERT_MAIL_TO}

admin:
  stats:
    cache-refresh-delay-ms: 7200000 # 2시간
