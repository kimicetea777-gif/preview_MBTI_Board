spring:
  application:
    name: kimicetea

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000
      keepalive-time: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 100
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  flyway:
    # clean-disabled: false
    enabled: true
    # clean-disabled: false
    # 로컬 개발용 더미 시드(db/migration/dev)는 기본값에 포함 — prod 프로필에서는 application-prod.yaml이 제외
    locations: classpath:db/migration,classpath:db/migration/dev

  mail:
    host: ${MAIL_HOST}
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: email, profile

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  access-expiry: 1800000 # 30분 (ms)
  refresh-expiry: 604800000 # 7일 (ms)
  signup-expiry: 600000 # 10분 (ms) — OAuth2 신규 가입 약관 동의 대기용

frontend:
  url: ${FRONTEND_URL:http://localhost:4000}

site:
  url: ${SITE_URL:http://localhost:4000}

app:
  name: ${APP_NAME:MBTI Board}
  cookie:
    secure: ${APP_COOKIE_SECURE:true} # 로컬 개발 시 환경변수 APP_COOKIE_SECURE=false 설정

r2:
  account-id: ${R2_ACCOUNT_ID}
  access-key: ${R2_ACCESS_KEY}
  secret-key: ${R2_SECRET_KEY}
  bucket: ${R2_BUCKET}
  public-url: ${R2_PUBLIC_URL}

internal:
  api-key: ${INTERNAL_API_KEY}

rate-limit:
  ip-salt: ${RATE_LIMIT_IP_SALT}

retention:
  encryption: #수사 협조 데이터 암호화
    password: ${RETENTION_ENCRYPTION_PASSWORD}
    salt: ${RETENTION_ENCRYPTION_SALT}

alert:
  mail:
    to: ${ALERT_MAIL_TO}

admin:
  stats:
    cache-refresh-delay-ms: ${ADMIN_STATS_CACHE_REFRESH_DELAY_MS:7200000} # 2시간
