spring:
  application:
    name: kimicetea

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000
      keepalive-time: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 100
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  flyway:
    # clean-disabled: false
    enabled: true
    # clean-disabled: false
    # 로컬 개발용 더미 시드(db/migration-dev)는 기본값에 포함 — prod 프로필에서는 application-prod.yaml이 제외
    # 주의: db/migration-dev는 db/migration의 하위 폴더가 아닌 형제 폴더여야 함 —
    #       Flyway는 location을 재귀적으로 스캔하므로, 하위 폴더로 두면 prod에서 classpath:db/migration만
    #       지정해도 그 안에 포함된 것으로 같이 스캔되어 제외가 안 됨 (실제로 겪은 버그)
    locations: classpath:db/migration,classpath:db/migration-dev

  mail:
    host: ${MAIL_HOST}
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

  security:
    oauth2:
      client:
        registration:
          # AS(Authorization Server, client_id=TypeButter) — 로그인/가입/비밀번호 재설정을 전부 위임.
          # google 소셜 로그인은 AS가 대신 처리하므로 여기엔 더 이상 필요 없음(connect_manual.md 참고).
          thebluebutter:
            client-id: TypeButter
            client-secret: ${AUTH_SERVER_CLIENT_SECRET}
            #access token 만료 후 사용자를 다시 로그인 화면으로 안 보내고 backend가 조용히 /oauth2/token에 grant_type=refresh_token으로만 요청해서 새 토큰을 받을 수 있게 허용
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/thebluebutter"
            scope: openid, profile
        provider:
          # thebluebutter는 Spring Boot의 사전 정의 provider 프리셋이 아니므로 issuer-uri를 직접 지정해야 함
          thebluebutter:
            issuer-uri: ${AUTH_SERVER_ISSUER_URI:http://localhost:9000}

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  access-expiry: 1800000 # 30분 (ms)
  refresh-expiry: 604800000 # 7일 (ms)

frontend:
  url: ${FRONTEND_URL:http://localhost:4000}

site:
  url: ${SITE_URL:http://localhost:4000}

app:
  name: ${APP_NAME:MBTI Board}
  cookie:
    secure: ${APP_COOKIE_SECURE:true} # 로컬 개발 시 환경변수 APP_COOKIE_SECURE=false 설정

r2:
  account-id: ${R2_ACCOUNT_ID}
  access-key: ${R2_ACCESS_KEY}
  secret-key: ${R2_SECRET_KEY}
  bucket: ${R2_BUCKET}
  public-url: ${R2_PUBLIC_URL}

internal:
  api-key: ${INTERNAL_API_KEY}

rate-limit:
  ip-salt: ${RATE_LIMIT_IP_SALT}

retention:
  encryption: #수사 협조 데이터 암호화
    password: ${RETENTION_ENCRYPTION_PASSWORD}
    salt: ${RETENTION_ENCRYPTION_SALT}

alert:
  mail:
    to: ${ALERT_MAIL_TO}

admin:
  stats:
    cache-refresh-delay-ms: ${ADMIN_STATS_CACHE_REFRESH_DELAY_MS:7200000} # 2시간
