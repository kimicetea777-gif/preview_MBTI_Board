spring:
  flyway:
    # 개발용 더미 시드(db/migration-dev — 가짜 유저 활동)는 제외, 실제 사이트에도 노출해도 되는
    # 시드(db/migration-seed)는 포함
    locations: classpath:db/migration,classpath:db/migration-seed

# Cloudflare Tunnel이 TLS를 종료하고 내부로는 http로 전달 — 이 설정이 없으면
# X-Forwarded-Proto 헤더를 무시해 OAuth2 redirect_uri가 http://로 생성되어
# Google Cloud Console에 등록된 https:// URI와 불일치(redirect_uri_mismatch) 발생
server:
  forward-headers-strategy: framework

logging:
  file:
    path: /var/log/mbti-board

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
