services:
  postgres:
    image: postgres:16-alpine
    container_name: mbti_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mbti_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend/mbti_board
    image: mbti-backend:latest
    container_name: mbti_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - backend_logs:/var/log/mbti-board
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend/mbti_board
    image: mbti-frontend:latest
    container_name: mbti_frontend
    restart: unless-stopped
    env_file:
      - ./.env_next
    environment:
      BACKEND_INTERNAL_URL: http://backend:8080
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

  # RAM/CPU/디스크 실시간 모니터링 대시보드 — 127.0.0.1에만 바인딩, 외부 미노출
  # 조회: ssh -L 19999:localhost:19999 mbti-server 로 터널링 후 브라우저에서 http://localhost:19999
  # 주의: docker.sock(ro)·procfs·sysfs를 마운트해 호스트/컨테이너 지표를 읽음 — 이 컨테이너에 호스트 가시성을 부여하는 의도적 트레이드오프
  netdata:
    image: netdata/netdata:latest
    container_name: mbti_netdata
    hostname: mbti-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:19999:19999"
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - netdata_config:/etc/netdata
      - netdata_lib:/var/lib/netdata
      - netdata_cache:/var/cache/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  postgres_data:
  redis_data:
  backend_logs:
  netdata_config:
  netdata_lib:
  netdata_cache:
