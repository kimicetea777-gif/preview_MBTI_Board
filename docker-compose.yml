services:
  postgres:
    image: postgres:16-alpine
    container_name: mbti_postgres
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mbti_redis
    restart: unless-stopped
    mem_limit: 128m
    command: redis-server --maxmemory 96mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend/mbti_board
    image: mbti-backend:latest
    container_name: mbti_backend
    restart: unless-stopped
    mem_limit: 768m
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - backend_logs:/var/log/mbti-board
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend/mbti_board
    image: mbti-frontend:latest
    container_name: mbti_frontend
    restart: unless-stopped
    mem_limit: 512m
    env_file:
      - ./.env_next
    environment:
      BACKEND_INTERNAL_URL: http://backend:8080
      # JVM과 달리 Node는 컨테이너 mem_limit(cgroup)을 자동으로 인식해 힙을 줄이지 않음 —
      # 명시 안 하면 호스트 전체 메모리 기준으로 힙을 키우려다 mem_limit에 막혀 OOM-kill될 수 있음
      NODE_OPTIONS: --max-old-space-size=384
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  backend_logs:
